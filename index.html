<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="schedule-storage" content="github" data-repo="junhyuck-lee/schedule-data">
<meta name="theme-color" content="#16191d">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>일정 관리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* 업무 대시보드형 일정 관리. 중립 회색 화면 위에서 카테고리 색만 정보를 운반한다.
   카테고리 6색은 dataviz 검증기(라이트·다크 모두 통과)를 거친 고정 순서 팔레트. */
:root{
  --bg:#f3f4f6;--surface:#ffffff;--surface-2:#f8f9fa;--line:#e2e5e9;--line-2:#eef0f2;
  --text:#14171a;--text-2:#555c64;--text-3:#868d95;
  --ink:#16191d;--on-ink:#ffffff;--wash:#eceef1;--focus:#2a78d6;
  --crit:#c93636;--crit-wash:#fbeaea;--warn:#a86200;--good:#1e7a3c;
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;
  --font:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --r:10px;color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:where(:not([data-theme="light"])){
    --bg:#0f1113;--surface:#181b1e;--surface-2:#1d2024;--line:#2b3035;--line-2:#23272b;
    --text:#eceef0;--text-2:#a9afb6;--text-3:#7c838b;
    --ink:#eceef0;--on-ink:#111315;--wash:#24282d;--focus:#3987e5;
    --crit:#e66767;--crit-wash:#3a2224;--warn:#e0a24a;--good:#5cc47c;
    --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#0ca30c;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1113;--surface:#181b1e;--surface-2:#1d2024;--line:#2b3035;--line-2:#23272b;
  --text:#eceef0;--text-2:#a9afb6;--text-3:#7c838b;
  --ink:#eceef0;--on-ink:#111315;--wash:#24282d;--focus:#3987e5;
  --crit:#e66767;--crit-wash:#3a2224;--warn:#e0a24a;--good:#5cc47c;
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#0ca30c;color-scheme:dark;
}
[data-c="school"]{--c:var(--s1)}[data-c="work"]{--c:var(--s2)}[data-c="personal"]{--c:var(--s3)}
[data-c="project"]{--c:var(--s4)}[data-c="exam"]{--c:var(--s5)}[data-c="etc"]{--c:var(--s6)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.ico{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.side{background:var(--surface);border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:18px;
  position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;padding:0 6px}
.brand i{width:28px;height:28px;border-radius:7px;background:var(--ink);color:var(--on-ink);display:grid;place-items:center;font-style:normal;font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 14px;border-radius:8px;
  border:1px solid var(--line);background:var(--surface);font-weight:500;white-space:nowrap}
.btn:hover{background:var(--wash)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.btn.primary:hover{opacity:.9}
.btn.danger{color:var(--crit)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--wash)}
.btn.block{width:100%;height:40px}
.btn.sm{height:30px;padding:0 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;height:38px;padding:0 10px;border:0;border-radius:8px;background:transparent;
  color:var(--text-2);font-weight:500;text-align:left}
.nav button:hover{background:var(--wash);color:var(--text)}
.nav button[aria-current="page"]{background:var(--wash);color:var(--text);font-weight:600}
.sect-h{font-size:12px;font-weight:600;color:var(--text-3);letter-spacing:.04em;padding:0 8px 6px;display:flex;justify-content:space-between}
.cats{display:flex;flex-direction:column;gap:1px}
.cat{display:flex;align-items:center;gap:10px;height:32px;padding:0 8px;border:0;background:transparent;border-radius:7px;text-align:left;color:var(--text)}
.cat:hover{background:var(--wash)}
.cat .sw{width:14px;height:14px;border-radius:4px;border:2px solid var(--c);background:var(--c)}
.cat[aria-pressed="false"] .sw{background:transparent}
.cat[aria-pressed="false"] span:not(.sw){color:var(--text-3);text-decoration:line-through}
.cat em{margin-left:auto;font-style:normal;font-size:12px;color:var(--text-3);font-variant-numeric:tabular-nums}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:6px}
.side-foot .btn{justify-content:flex-start}
.status{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--text-3);padding:4px 8px}
.status::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--text-3)}
.status[data-s="ok"]::before{background:var(--good)}
.status[data-s="err"]::before{background:var(--crit)}

/* mini calendar */
.mini{padding:0 2px}
.mini-h{display:flex;align-items:center;justify-content:space-between;padding:0 4px 6px;font-weight:600;font-size:13px}
.mini-h button{border:0;background:transparent;width:26px;height:26px;border-radius:6px;color:var(--text-2)}
.mini-h button:hover{background:var(--wash)}
.mini-g{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;text-align:center;font-size:12px}
.mini-g span{color:var(--text-3);font-size:11px;padding:2px 0}
.mini-g button{border:0;background:transparent;height:30px;border-radius:6px;font-variant-numeric:tabular-nums;position:relative;color:var(--text)}
.mini-g button:hover{background:var(--wash)}
.mini-g button.out{color:var(--text-3)}
.mini-g button.today{font-weight:700;color:var(--focus)}
.mini-g button.sel{background:var(--ink);color:var(--on-ink)}
.mini-g button.has::after{content:"";position:absolute;left:50%;bottom:3px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--text-3)}
.mini-g button.sel.has::after{background:var(--on-ink)}

/* top bar */
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);
  display:flex;align-items:center;gap:12px;padding:14px 24px;border-bottom:1px solid var(--line)}
.ttl{min-width:0;flex:1}
.ttl h1{margin:0;font-size:20px;line-height:1.25;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl div{font-size:12.5px;color:var(--text-3)}
.pager{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;background:var(--surface);overflow:hidden}
.pager button{border:0;background:transparent;height:34px;min-width:36px;padding:0 10px;color:var(--text-2)}
.pager button+button{border-left:1px solid var(--line)}
.pager button:hover{background:var(--wash);color:var(--text)}
.search{position:relative;width:min(260px,30vw)}
.search .ico{position:absolute;left:10px;top:9px;color:var(--text-3)}
.search input{width:100%;height:36px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:0 10px 0 34px}
.search input:focus{outline:none;border-color:var(--focus);box-shadow:0 0 0 1px var(--focus)}
.iconbtn{position:relative;width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--text-2)}
.iconbtn:hover{background:var(--wash);color:var(--text)}
.iconbtn b{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;border-radius:9px;background:var(--crit);color:#fff;font-size:11px;
  display:grid;place-items:center;padding:0 4px;font-variant-numeric:tabular-nums}
.only-m{display:none}

.content{flex:1;display:grid;grid-template-columns:1fr;gap:20px;padding:20px 24px 40px;min-width:0}
.content.with-rail{grid-template-columns:minmax(0,1fr) 300px}
.rail{display:flex;flex-direction:column;gap:16px;min-width:0}
#view{min-width:0}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line-2)}
.card-h h2{margin:0;font-size:14.5px;font-weight:600}
.card-h small{color:var(--text-3);font-size:12px}
.card-b{padding:8px 16px 14px}
.empty{color:var(--text-3);font-size:13px;padding:14px 2px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:16px}
.kpi{padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.kpi .k{font-size:12.5px;color:var(--text-2);font-weight:500}
.kpi .v{font-size:28px;font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi .v small{font-size:14px;font-weight:500;color:var(--text-2);margin-left:3px}
.kpi .d{font-size:12.5px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stack{display:flex;flex-direction:column;gap:16px}

/* occurrence rows */
.occ{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px solid var(--line-2)}
.occ:last-child{border-bottom:0}
.chk{flex:none;width:20px;height:20px;margin-top:2px;border-radius:5px;border:1.5px solid var(--line);background:transparent;display:grid;place-items:center;padding:0;color:transparent}
.chk:hover{border-color:var(--text-2)}
.chk[aria-checked="true"]{background:var(--good);border-color:var(--good);color:#fff}
.chk svg{width:13px;height:13px;stroke:currentColor;stroke-width:3;fill:none}
.occ-t{flex:none;width:86px;font-size:12.5px;color:var(--text-2);font-variant-numeric:tabular-nums;padding-top:1px;line-height:1.35}
.occ-b{flex:1;min-width:0;border:0;background:transparent;padding:0 0 0 10px;text-align:left;border-left:3px solid var(--c);border-radius:0}
.occ-b:hover .occ-n{text-decoration:underline}
.occ-n{font-weight:500;overflow-wrap:anywhere}
.occ.done .occ-n{text-decoration:line-through;color:var(--text-3)}
.occ-m{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:12px;color:var(--text-3)}
.occ-m .cl{color:var(--text-2);font-weight:500}
.dgrp{font-size:12.5px;font-weight:600;color:var(--text-2);padding:14px 0 2px;border-bottom:1px solid var(--line);display:flex;gap:8px}
.dgrp.today{color:var(--focus)}
.dday{flex:none;font-variant-numeric:tabular-nums;font-weight:700;font-size:13px;min-width:56px;text-align:right}
.dday.hot{color:var(--crit)}
.dday.near{color:var(--warn)}
.week-mini{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;padding-top:6px}
.wm{display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:transparent;padding:6px 0;border-radius:8px}
.wm:hover{background:var(--wash)}
.wm .bars{height:84px;width:22px;display:flex;flex-direction:column-reverse;gap:2px;justify-content:flex-start}
.wm .bars i{display:block;background:var(--c);border-radius:2px;min-height:4px}
.wm .bars i:last-child{border-radius:4px 4px 2px 2px}
.wm .l{font-size:12px;color:var(--text-2)}
.wm .n{font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
.wm.today .l{color:var(--focus);font-weight:700}

/* month view */
.month{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.mhead{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--line)}
.mhead span{padding:8px 10px;font-size:12px;font-weight:600;color:var(--text-2)}
.mhead span:nth-child(6){color:var(--s1)}.mhead span:nth-child(7){color:var(--crit)}
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-auto-rows:minmax(118px,1fr)}
.mcell{border-right:1px solid var(--line-2);border-bottom:1px solid var(--line-2);padding:6px 6px 4px;display:flex;flex-direction:column;gap:2px;min-width:0;cursor:pointer;position:relative}
.mcell:nth-child(7n){border-right:0}
.mcell:hover{background:var(--surface-2)}
.mcell.out{background:var(--surface-2)}
.mcell.out .mnum{color:var(--text-3)}
.mnum{font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums;width:24px;height:24px;display:grid;place-items:center;border-radius:50%;margin-bottom:2px}
.mcell.today .mnum{background:var(--ink);color:var(--on-ink)}
.mcell:nth-child(7n-1) .mnum{color:var(--s1)}.mcell:nth-child(7n) .mnum{color:var(--crit)}
.mcell.today:nth-child(7n-1) .mnum,.mcell.today:nth-child(7n) .mnum{color:var(--on-ink)}
.chip{display:flex;align-items:center;gap:5px;width:100%;border:0;background:transparent;padding:1px 4px;border-radius:4px;font-size:12px;text-align:left;
  white-space:nowrap;overflow:hidden;color:var(--text);min-width:0}
.chip:hover{background:var(--wash)}
.chip::before{content:"";flex:none;width:6px;height:6px;border-radius:50%;background:var(--c)}
.chip.all{background:color-mix(in srgb,var(--c) 16%,transparent)}
.chip.all::before{width:3px;height:12px;border-radius:2px}
.chip b{font-weight:500;color:var(--text-2);font-variant-numeric:tabular-nums}
.chip span{overflow:hidden;text-overflow:ellipsis}
.chip.done span{text-decoration:line-through;color:var(--text-3)}
.more{border:0;background:transparent;font-size:11.5px;color:var(--text-2);text-align:left;padding:1px 4px;font-weight:600}
.more:hover{text-decoration:underline}
.mdots{display:none}

/* week view */
.wwrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:auto;max-height:calc(100vh - 150px)}
.wk{display:grid;grid-template-columns:56px repeat(7,minmax(108px,1fr));min-width:820px}
.wk-h{position:sticky;top:0;z-index:2;background:var(--surface);border-bottom:1px solid var(--line);border-left:1px solid var(--line-2);
  padding:8px 10px;display:flex;align-items:baseline;gap:6px;cursor:pointer}
.wk-h b{font-size:20px;font-variant-numeric:tabular-nums}
.wk-h span{font-size:12px;color:var(--text-2)}
.wk-h.today b{color:var(--focus)}
.wk-c0{position:sticky;top:0;z-index:2;background:var(--surface);border-bottom:1px solid var(--line)}
.wk-al{border-left:1px solid var(--line-2);border-bottom:1px solid var(--line);padding:4px;display:flex;flex-direction:column;gap:2px;min-height:34px}
.wk-lab{font-size:11px;color:var(--text-3);padding:6px 4px;border-bottom:1px solid var(--line);text-align:right}
.wk-hours{position:relative;height:calc(var(--hours) * var(--px))}
.wk-hours span{position:absolute;right:8px;font-size:11px;color:var(--text-3);transform:translateY(-50%);font-variant-numeric:tabular-nums}
.wk-col{position:relative;height:calc(var(--hours) * var(--px));border-left:1px solid var(--line-2);cursor:cell;
  background-image:linear-gradient(to bottom,var(--line-2) 1px,transparent 1px);background-size:100% var(--px)}
.wk-col.today{background-color:color-mix(in srgb,var(--focus) 4%,transparent)}
.blk{position:absolute;border:0;border-left:3px solid var(--c);border-radius:5px;padding:3px 6px;font-size:12px;line-height:1.3;
  overflow:hidden;text-align:left;color:var(--text);background:color-mix(in srgb,var(--c) 16%,var(--surface));
  box-shadow:0 0 0 2px var(--surface);display:flex;flex-direction:column}
.blk:hover{background:color-mix(in srgb,var(--c) 26%,var(--surface))}
.blk small{color:var(--text-2);font-variant-numeric:tabular-nums;font-size:11px}
.blk b{font-weight:600;overflow-wrap:anywhere}
.blk.done{opacity:.55}.blk.done b{text-decoration:line-through}
.now{position:absolute;left:0;right:0;height:2px;background:var(--crit);pointer-events:none;z-index:1}
.now::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--crit)}

/* stats */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;height:32px;padding:0 12px;font-size:13px;color:var(--text-2)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--on-ink);font-weight:500}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:16px}
.chart{width:100%;display:block;overflow:visible}
.chart text{font-family:var(--font);font-size:11px;fill:var(--text-3)}
.chart .gl{stroke:var(--line-2);stroke-width:1}
.chart .ax{stroke:var(--line);stroke-width:1}
.chart .val{fill:var(--text-2);font-weight:600}
.hb{display:flex;flex-direction:column;gap:10px;padding:6px 0}
.hb-r{display:grid;grid-template-columns:72px 1fr 92px;align-items:center;gap:10px;font-size:13px;border-radius:6px}
.hb-r .bar{height:14px;background:var(--line-2);border-radius:3px;overflow:hidden}
.hb-r .bar i{display:block;height:100%;background:var(--c);border-radius:0 4px 4px 0}
.hb-r .v{text-align:right;color:var(--text-2);font-variant-numeric:tabular-nums}
.hb-r .n{display:flex;align-items:center;gap:6px}
.hb-r .n::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--c)}
.tbl{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:7px 8px;border-bottom:1px solid var(--line-2);text-align:right}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl th{color:var(--text-2);font-weight:600;font-size:12px}
.tip{position:fixed;z-index:60;pointer-events:none;background:var(--ink);color:var(--on-ink);font-size:12px;padding:6px 9px;border-radius:6px;
  max-width:240px;line-height:1.45;box-shadow:0 6px 18px rgba(0,0,0,.18);white-space:pre-line}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(12,14,16,.45);z-index:40;display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border-radius:14px;width:min(560px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column;
  box-shadow:0 24px 60px rgba(0,0,0,.25);border:1px solid var(--line)}
.modal.sm{width:min(420px,100%)}
.m-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line-2)}
.m-h h2{margin:0;font-size:17px}
.m-b{padding:16px 20px;overflow:auto;display:flex;flex-direction:column;gap:14px}
.m-f{display:flex;gap:8px;padding:12px 20px;border-top:1px solid var(--line-2);flex-wrap:wrap}
.m-f .sp{flex:1}
.f{display:flex;flex-direction:column;gap:6px;min-width:0}
.fl{font-size:12.5px;font-weight:600;color:var(--text-2)}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;align-items:end}
.in{height:38px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:0 10px;width:100%;min-width:0}
.in:focus{outline:none;border-color:var(--focus);box-shadow:0 0 0 1px var(--focus)}
.in.big{height:44px;font-size:17px;font-weight:500}
textarea.in{height:auto;min-height:80px;padding:8px 10px;resize:vertical;line-height:1.6}
.in.err{border-color:var(--crit)}

<script>
(function(){
'use strict';
/* ================= constants & helpers ================= */
var CATS=[{k:'school',n:'수업'},{k:'work',n:'공부/복습'},{k:'project',n:'과제'},{k:'exam',n:'시험/퀴즈'},{k:'personal',n:'개인'},{k:'etc',n:'기타'}];
var DDAY_CATS={project:1,exam:1}; // 과제·시험은 D-day 자동
var catName=function(k){for(var i=0;i<CATS.length;i++)if(CATS[i].k===k)return CATS[i].n;return '기타'};
var DS=['월','화','수','목','금','토','일'];
var REMIND=[[-1,'알림 없음'],[0,'정시'],[5,'5분 전'],[10,'10분 전'],[30,'30분 전'],[60,'1시간 전'],[180,'3시간 전'],[1440,'하루 전']];
var FREQ=[['none','반복 안 함'],['daily','매일'],['weekly','매주'],['monthly','매월'],['yearly','매년']];
var VIEWS=[['dash','대시보드','M3 3h7v9H3zM14 3h7v5h-7zM14 12h7v9h-7zM3 16h7v5H3z'],
  ['month','월간','M4 5h16v15H4zM4 9h16M9 3v4M15 3v4'],
  ['week','주간','M4 5h16v15H4zM4 9h16M9.3 9v11M14.6 9v11'],
  ['subjects','과목','M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5zM4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5'],
  ['list','목록','M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01'],
  ['stats','통계','M4 20V10M10 20V4M16 20v-7M22 20H2']];
var ICON={menu:'M4 6h16M4 12h16M4 18h16',search:'M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM21 21l-5-5',
  bell:'M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0',left:'M15 18l-6-6 6-6',right:'M9 18l6-6-6-6',
  xls:'M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9zM14 3v6h6M9 13l6 6M15 13l-6 6',x:'M18 6L6 18M6 6l12 12',
  rep:'M17 2l4 4-4 4M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4M21 13v2a3 3 0 0 1-3 3H3',pin:'M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11zM12 12a2 2 0 1 0 0-4 2 2 0 0 0 0 4z',
  check:'M5 12l5 5L20 7'};
function svgIco(d){return '<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="'+d+'"/></svg>'}

var $=function(id){return document.getElementById(id)};
var pad=function(n){return (n<10?'0':'')+n};
var keyOf=function(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
var dayOnly=function(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate())};
var addDays=function(d,n){var x=dayOnly(d);x.setDate(x.getDate()+n);return x};
var mondayOf=function(d){return addDays(d,-((d.getDay()+6)%7))};
var parseKey=function(s){var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||'');return m?new Date(+m[1],+m[2]-1,+m[3]):null};
var wdOf=function(d){return (d.getDay()+6)%7};
var todayKey=function(){return keyOf(new Date())};
var toMin=function(s){var m=/^(\d{2}):(\d{2})$/.exec(s||'');return m?(+m[1])*60+(+m[2]):null};
var hm=function(m){m=Math.max(0,Math.min(1439,m));return pad(Math.floor(m/60))+':'+pad(m%60)};
var diffDays=function(a,b){return Math.round((dayOnly(b)-dayOnly(a))/864e5)};
function fmtDur(m){if(!m)return '0분';var h=Math.floor(m/60),r=m%60;return (h?h+'시간':'')+(h&&r?' ':'')+(r?r+'분':'')}
function fmtHours(m){var h=m/60;return (Math.round(h*10)/10)+'시간'}
function fmtDate(k,withYear){var d=parseKey(k);if(!d)return '';return (withYear?d.getFullYear()+'년 ':'')+(d.getMonth()+1)+'월 '+d.getDate()+'일 ('+DS[wdOf(d)]+')'}
function ddText(n){return n===0?'D-DAY':n>0?'D-'+n:'D+'+(-n)}
var uid=function(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)};
var clone=function(o){return JSON.parse(JSON.stringify(o))};

var PROPS={value:1,checked:1,disabled:1,selected:1,innerHTML:1};
function h(tag,attrs){var el=document.createElement(tag);
  if(attrs)for(var k in attrs){var v=attrs[k];if(v==null||v===false)continue;
    if(k==='class')el.className=v;else if(k==='text')el.textContent=v;else if(k.slice(0,2)==='on')el.addEventListener(k.slice(2),v);
    else if(PROPS[k])el[k]=v;else el.setAttribute(k,v===true?'':v)}
  for(var i=2;i<arguments.length;i++)add(el,arguments[i]);return el}
function add(el,c){if(c==null||c===false)return;if(Array.isArray(c)){c.forEach(function(x){add(el,x)});return}
  el.appendChild(typeof c==='string'||typeof c==='number'?document.createTextNode(String(c)):c)}
function lsGet(k,d){try{var v=localStorage.getItem('sched:'+k);return v==null?d:JSON.parse(v)}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem('sched:'+k,JSON.stringify(v))}catch(e){}}

/* ================= event model ================= */
function normEvent(r){if(!r||typeof r!=='object'||typeof r.id!=='string'||typeof r.title!=='string')return null;
  var rep=r.rep&&typeof r.rep==='object'?r.rep:{};
  var f=['daily','weekly','monthly','yearly'].indexOf(rep.f)>-1?rep.f:'none';
  var kd=function(v){return parseKey(v)?v:''};
  var arr=function(a){return Array.isArray(a)?a.filter(function(x){return parseKey(x)}):[]};
  return {id:r.id,title:r.title,date:kd(r.date)||todayKey(),allDay:!!r.allDay,start:toMin(r.start)!=null?r.start:'',end:toMin(r.end)!=null?r.end:'',
    cat:CATS.some(function(c){return c.k===r.cat})?r.cat:'etc',subj:typeof r.subj==='string'?r.subj.trim().slice(0,40):'',place:typeof r.place==='string'?r.place:'',note:typeof r.note==='string'?r.note:'',
    rep:{f:f,n:Math.max(1,Math.min(99,parseInt(rep.n,10)||1)),wd:Array.isArray(rep.wd)?rep.wd.filter(function(x){return x>=0&&x<=6}):[],until:kd(rep.until)},
    remind:REMIND.some(function(x){return x[0]===r.remind})?r.remind:-1,dday:!!r.dday,done:arr(r.done),ex:arr(r.ex),
    created:+r.created||Date.now(),updated:+r.updated||Date.now()}}

/* expand one event into the occurrence dates inside [from,to] (YYYY-MM-DD, inclusive) */
function expand(ev,from,to){
  var out=[],s=parseKey(ev.date),F=parseKey(from),T=parseKey(to);if(!s||!F||!T)return out;
  var U=ev.rep.until?parseKey(ev.rep.until):null,end=U&&U<T?U:T;if(end<F||s>end)return out;
  var ex={};ev.ex.forEach(function(k){ex[k]=1});
  var push=function(d){if(d<s||d<F||d>end)return;var k=keyOf(d);if(!ex[k])out.push(k)};
  var n=ev.rep.n||1,d,i;
  switch(ev.rep.f){
    case 'daily':d=s;if(F>s){d=addDays(s,Math.ceil(diffDays(s,F)/n)*n)}
      for(i=0;d<=end&&i<5000;i++,d=addDays(d,n))push(d);break;
    case 'weekly':var wds=ev.rep.wd.length?ev.rep.wd:[wdOf(s)],wk=mondayOf(s);
      if(F>wk){var w=Math.floor(diffDays(wk,mondayOf(F))/7);wk=addDays(wk,Math.floor(w/n)*n*7)}
      for(i=0;wk<=end&&i<2000;i++,wk=addDays(wk,7*n))wds.forEach(function(x){push(addDays(wk,x))});break;
    case 'monthly':var dom=s.getDate(),y=s.getFullYear(),m=s.getMonth();
      if(F>s){var ms=(F.getFullYear()-y)*12+(F.getMonth()-m);m+=Math.max(0,Math.floor(ms/n)-1)*n}
      for(i=0;i<2400;i++,m+=n){var first=new Date(y,m,1);if(first>end)break;d=new Date(y,m,dom);if(d.getMonth()===first.getMonth())push(d)}break;
    case 'yearly':var yy=s.getFullYear();if(F.getFullYear()>yy)yy+=Math.max(0,Math.floor((F.getFullYear()-yy)/n)-1)*n;
      for(i=0;i<400;i++,yy+=n){d=new Date(yy,s.getMonth(),s.getDate());if(new Date(yy,0,1)>end)break;if(d.getMonth()===s.getMonth())push(d)}break;
    default:push(s)}
  out.sort();return out}
function evDur(ev){if(ev.allDay)return 0;var a=toMin(ev.start),b=toMin(ev.end);if(a==null||b==null)return 0;return Math.max(0,b-a)}
function occ(ev,k){return {ev:ev,date:k,id:ev.id+'@'+k,done:ev.done.indexOf(k)>-1}}
function occCmp(a,b){if(a.date!==b.date)return a.date<b.date?-1:1;if(a.ev.allDay!==b.ev.allDay)return a.ev.allDay?-1:1;
  var x=a.ev.start||'99',y=b.ev.start||'99';return x<y?-1:x>y?1:a.ev.title.localeCompare(b.ev.title)}
function occIn(from,to,opts){opts=opts||{};var out=[];
  Store.list().forEach(function(ev){if(!opts.all&&S.hidden[ev.cat])return;if(opts.match&&!opts.match(ev))return;
    expand(ev,from,to).forEach(function(k){out.push(occ(ev,k))})});return out.sort(occCmp)}
/* ---------- 과목 ----------
   과목 이름은 세 군데서 모은다: ① 직접 추가한 과목 목록(비공개 데이터 파일의 subjects)
   ② 일정에 직접 지정한 과목(subj) ③ '수업' 일정의 제목. 과목을 지정하지 않은 일정은
   제목에 들어 있는 가장 긴 과목 이름으로 화면에서만 묶는다(파일은 바꾸지 않음). */
var SUBJ={list:lsGet('subjects',[]),dirty:!!lsGet('subjDirty',false),memo:null};
var normS=function(t){return String(t||'').replace(/\s+/g,'').toLowerCase()};
function subjIndex(){if(SUBJ.memo)return SUBJ.memo;var seen={},names=[],src={};
  function addN(n,how){n=String(n||'').trim();if(!n||n.length>40)return;var k=normS(n);if(!k)return;if(!seen[k]){seen[k]=n;names.push(n);src[n]={}}src[seen[k]][how]=1}
  SUBJ.list.forEach(function(n){addN(n,'custom')});
  Store.list().forEach(function(ev){if(ev.subj)addN(ev.subj,'event')});
  Store.list().forEach(function(ev){if(ev.cat==='school'&&!ev.subj&&ev.title.length<=24)addN(ev.title,'class')});
  names.sort(function(a,b){return a.localeCompare(b,'ko')});
  var byLen=names.slice().sort(function(a,b){return normS(b).length-normS(a).length});
  SUBJ.memo={names:names,byLen:byLen,src:src,canon:seen};return SUBJ.memo}
function autoSubj(title){var t=normS(title),ix=subjIndex();for(var i=0;i<ix.byLen.length;i++){if(t.indexOf(normS(ix.byLen[i]))>-1)return ix.byLen[i]}return ''}
function subjOf(ev){if(ev.subj){var c=subjIndex().canon[normS(ev.subj)];return c||ev.subj}return autoSubj(ev.title)}

var Store={mode:'local',map:{},db:null,chains:{},
  list:function(){var m=this.map;return Object.keys(m).map(function(k){return m[k]})},
  get:function(id){return this.map[id]},
  setAll:function(arr){var m={};arr.forEach(function(r){var e=normEvent(r);if(e)m[e.id]=e});this.map=m;lsSet('cache',arr)},
  put:function(ev){ev.updated=Date.now();this.map[ev.id]=ev;lsSet('cache',this.list());this.persist(ev);refresh();setTimeout(checkReminders,400)},
  del:function(id){delete this.map[id];lsSet('cache',this.list());this.remove(id);refresh()},
  persist:function(ev){var self=this,body=clone(ev);
    if(this.mode==='github'){GH.pendPut[ev.id]=1;delete GH.pendDel[ev.id];ghSavePending();ghSchedule();return}
    if(this.mode==='artifact'){setStatus('wait','저장 중');
      this.chains[ev.id]=(this.chains[ev.id]||Promise.resolve()).then(function(){return self.db.doc('events/'+ev.id).set(body)})
        .then(function(){setStatus('ok','클라우드에 동기화됨')},function(e){setStatus('err',e&&e.code==='quota_exceeded'?'저장 공간이 가득 찼어요':'저장 실패 · 이 기기에는 보관됨')})}
    else if(this.mode==='api'){setStatus('wait','저장 중');
      api('PUT','api/events/'+encodeURIComponent(ev.id),body).then(function(){setStatus('ok','서버에 저장됨')},function(){setStatus('err','서버 저장 실패 · 이 기기에는 보관됨')})}
  },
  remove:function(id){var self=this;
    if(this.mode==='github'){GH.pendDel[id]=1;delete GH.pendPut[id];ghSavePending();ghSchedule();return}
    if(this.mode==='artifact'){this.chains[id]=(this.chains[id]||Promise.resolve()).then(function(){return self.db.doc('events/'+id).delete()})
        .then(function(){setStatus('ok','클라우드에 동기화됨')},function(){setStatus('err','삭제 실패')})}
    else if(this.mode==='api'){api('DELETE','api/events/'+encodeURIComponent(id)).then(function(){setStatus('ok','서버에 저장됨')},function(){setStatus('err','서버 삭제 실패')})}
  }};
function api(method,url,body){return fetch(url,{method:method,credentials:'same-origin',headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined})
  .then(function(r){if(r.status===401){showLogin();throw new Error('auth')}if(!r.ok)throw new Error('http '+r.status);return r.status===204?null:r.json()})}

function setStatus(s,t){var el=$('status');el.dataset.s=s;el.textContent=t}

/* ---------- GitHub 모드: 비공개 저장소의 events.json 하나에 저장 ----------
   화면(이 파일)은 공개 GitHub Pages에 있어도 일정은 들어 있지 않다.
   일정은 비공개 저장소에만 있고, 그 저장소 하나에만 권한이 있는 토큰을 가진 기기만 읽고 쓴다. */
var GH={cfg:lsGet('gh',null),path:'events.json',sha:null,loaded:false,pendPut:{},pendDel:{},timer:0,busy:false,again:false};
function ghMeta(){var m=document.querySelector('meta[name="schedule-storage"]');return m&&m.content==='github'?{repo:m.getAttribute('data-repo')||''}:null}
function ghHasPending(){return Object.keys(GH.pendPut).length+Object.keys(GH.pendDel).length>0||SUBJ.dirty}
function ghSavePending(){lsSet('ghPending',{p:GH.pendPut,d:GH.pendDel})}
function b64enc(s){var b=new TextEncoder().encode(s),bin='';for(var i=0;i<b.length;i+=0x8000)bin+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(bin)}
function b64dec(s){var bin=atob(s.replace(/\s/g,'')),u=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new TextDecoder().decode(u)}
function gh(method,path,body,accept,cfg){var c=cfg||GH.cfg;
  return fetch('https://api.github.com/repos/'+c.repo+path,{method:method,cache:'no-store',
    headers:Object.assign({'Authorization':'Bearer '+c.token,'Accept':accept||'application/vnd.github+json'},body?{'Content-Type':'application/json'}:{}),
    body:body?JSON.stringify(body):undefined})}
function ghParse(t){try{var j=JSON.parse(t);return Array.isArray(j)?j:(j&&Array.isArray(j.events)?j.events:[])}catch(e){return []}}
function ghParseSubj(t){try{var j=JSON.parse(t);return j&&Array.isArray(j.subjects)?j.subjects.filter(function(x){return typeof x==='string'&&x.trim()}):null}catch(e){return null}}
function ghRead(){var p='/contents/'+GH.path+'?t='+Date.now();
  return gh('GET',p).then(function(r){
    if(r.status===404)return {sha:null,events:[],subjects:null};
    if(r.status===401||r.status===403)throw {code:'auth'};
    if(!r.ok)throw {code:'http',status:r.status};
    return r.json().then(function(j){
      if(j.encoding==='base64'&&j.content){var txt=b64dec(j.content);return {sha:j.sha,events:ghParse(txt),subjects:ghParseSubj(txt)}}
      return gh('GET',p,null,'application/vnd.github.raw').then(function(r2){return r2.text()}).then(function(t){return {sha:j.sha,events:ghParse(t),subjects:ghParseSubj(t)}})})})}
function ghSchedule(){if(!GH.cfg){setStatus('err','GitHub 연결이 필요해요');return}clearTimeout(GH.timer);setStatus('wait','저장 대기 중');GH.timer=setTimeout(ghSync,1200)}
function ghSync(){
  if(!GH.cfg)return;if(GH.busy){GH.again=true;return}
  GH.busy=true;setStatus('wait','GitHub에 저장 중');
  var puts=GH.pendPut,dels=GH.pendDel,n=Object.keys(puts).length+Object.keys(dels).length,tries=0,merged,subjOut,subjW=SUBJ.dirty;SUBJ.dirty=false;
  GH.pendPut={};GH.pendDel={};
  function attempt(){return ghRead().then(function(remote){
      // 이번에 고치지 않은 일정은 파일에 있던 그대로 다시 쓴다 (형식 변환 없음)
      var m={};remote.events.forEach(function(r){var e=normEvent(r);if(e)m[e.id]=r});
      Object.keys(dels).forEach(function(id){delete m[id]});
      Object.keys(puts).forEach(function(id){if(Store.map[id])m[id]=Store.map[id]});
      merged=Object.keys(m).sort().map(function(k){return m[k]});
      subjOut=subjW?SUBJ.list.slice():(remote.subjects||SUBJ.list.slice());
      var fileObj={app:'schedule',v:1,updated:new Date().toISOString(),events:merged};if(subjOut.length||remote.subjects)fileObj.subjects=subjOut;
      var body={message:n?'일정 업데이트 ('+n+'건)':'과목 목록 업데이트',content:b64enc(JSON.stringify(fileObj,null,1))};
      if(remote.sha)body.sha=remote.sha;
      return gh('PUT','/contents/'+GH.path,body).then(function(r){
        if(r.status===409||r.status===422){if(++tries<4)return attempt();throw {code:'conflict'}}
        if(r.status===401||r.status===403||r.status===404)throw {code:'auth'};
        if(!r.ok)throw {code:'http',status:r.status};
        return r.json().then(function(j){GH.sha=j.content&&j.content.sha;GH.loaded=true})})})}
  attempt().then(function(){
    // 다른 기기에서 바뀐 내용 + 저장하는 동안 이 기기에서 새로 고친 내용을 함께 반영
    var nm={};merged.forEach(function(r){var e=normEvent(r);if(e)nm[e.id]=e});
    Object.keys(GH.pendPut).forEach(function(id){if(Store.map[id])nm[id]=Store.map[id]});
    Object.keys(GH.pendDel).forEach(function(id){delete nm[id]});
    Store.map=nm;lsSet('cache',Store.list());if(!SUBJ.dirty){SUBJ.list=subjOut;lsSet('subjects',subjOut)}lsSet('subjDirty',SUBJ.dirty);ghSavePending();GH.busy=false;refresh();
    setStatus('ok','GitHub에 저장됨');
    if(GH.again||ghHasPending()){GH.again=false;ghSchedule()}
  },function(e){GH.busy=false;if(subjW){SUBJ.dirty=true;lsSet('subjDirty',true)}
    Object.keys(puts).forEach(function(id){if(!GH.pendDel[id])GH.pendPut[id]=1});
    Object.keys(dels).forEach(function(id){if(!GH.pendPut[id])GH.pendDel[id]=1});ghSavePending();
    if(e&&e.code==='auth'){setStatus('err','GitHub 토큰을 확인해 주세요');showGhConnect(true)}
    else{setStatus('err','GitHub 저장 실패 · 이 기기에 보관 중, 곧 다시 시도');clearTimeout(GH.timer);GH.timer=setTimeout(ghSync,20000)}})}
function ghPull(){if(!GH.cfg||GH.busy)return;if(ghHasPending()){ghSync();return}
  ghRead().then(function(remote){if(GH.loaded&&remote.sha===GH.sha)return;GH.sha=remote.sha;GH.loaded=true;
    if(ghHasPending()||GH.busy)return;Store.setAll(remote.events);if(remote.subjects){SUBJ.list=remote.subjects;lsSet('subjects',remote.subjects)}setStatus('ok','GitHub와 동기화됨');refresh()},
  function(e){if(e&&e.code==='auth'){setStatus('err','GitHub 토큰을 확인해 주세요');showGhConnect(true)}else setStatus('err','GitHub에 연결하지 못했어요 · 이 기기에 보관 중')})}

  return api('GET','api/events').then(function(list){Store.setAll(list||[]);setStatus('ok','서버에 저장됨');refresh()},function(e){if(e.message!=='auth')setStatus('err','서버에 연결하지 못했어요')})}
function listenArtifact(){
  var timer=setTimeout(function(){setStatus('err','클라우드에 아직 연결되지 않았어요')},10000);
  Store.db.collection('events').onSnapshot(function(snap){
    if(!snap.metadata.fromCache){clearTimeout(timer);setStatus('ok','클라우드에 동기화됨')}
    var arr=snap.docs.map(function(d){return d.data()});
    var first=!listenArtifact.seen;listenArtifact.seen=true;
    // first sync: if the cloud is empty but this browser has local data, offer to upload it
    if(first&&!snap.metadata.fromCache&&!arr.length){var local=lsGet('cache',[]);if(local.length)offerUpload(local)}
    Store.setAll(arr);refresh();
  },function(){clearTimeout(timer);setStatus('err','클라우드 연결이 끊겼어요 · 새로고침해 주세요')});
}

    '완료':o.done?'완료':(o.date<=t?'미완료':'예정'),'D-day':ev.dday?ddText(diffDays(new Date(),parseKey(o.date))):'','메모':ev.note}});
  var ws1=X.utils.json_to_sheet(rows.length?rows:[{'날짜':'','제목':'(이 기간에 일정이 없어요)'}]);
  ws1['!cols']=[12,5,7,7,8,28,14,9,16,20,8,8,36].map(function(w){return {wch:w}});ws1['!autofilter']={ref:ws1['!ref']};
  var src=Store.list().filter(function(ev){return all||!S.hidden[ev.cat]}).sort(function(a,b){return a.date<b.date?-1:1}).map(function(ev){return {'ID':ev.id,'제목':ev.title,'시작 날짜':ev.date,
    '시간':timeText(ev),'과목':subjOf(ev),'종류':catName(ev.cat),'반복':repText(ev)||'반복 안 함','알림':REMIND.filter(function(x){return x[0]===ev.remind})[0][1],'D-day':ev.dday?'표시':'','장소':ev.place,'메모':ev.note,
    '완료한 날짜 수':ev.done.length,'제외한 날짜':ev.ex.join(', ')}});
  var ws2=X.utils.json_to_sheet(src.length?src:[{'제목':'(일정 없음)'}]);ws2['!cols']=[16,28,12,14,14,9,22,10,7,16,36,10,24].map(function(w){return {wch:w}});
  var months={};list.forEach(function(o){var k=o.date.slice(0,7),m=months[k]=months[k]||{'월':k,'일정 수':0,'지난 일정':0,'완료':0,'완료율(%)':'','계획 시간(시간)':0};
    m['일정 수']++;if(o.date<=t){m['지난 일정']++;if(o.done)m['완료']++}m['계획 시간(시간)']+=evDur(o.ev)/60});
  var mrows=Object.keys(months).sort().map(function(k){var m=months[k];m['완료율(%)']=m['지난 일정']?Math.round(m['완료']/m['지난 일정']*100):'';m['계획 시간(시간)']=Math.round(m['계획 시간(시간)']*10)/10;return m});
  var catRows=CATS.map(function(c){var l=list.filter(function(o){return o.ev.cat===c.k});return {'종류':c.n,'일정 수':l.length,'계획 시간(시간)':Math.round(l.reduce(function(s,o){return s+evDur(o.ev)},0)/6)/10}});
  var ws3=X.utils.json_to_sheet(mrows.length?mrows:[{'월':'(데이터 없음)'}]);X.utils.sheet_add_json(ws3,catRows,{origin:{r:mrows.length+3,c:0}});
  ws3['!cols']=[12,10,10,8,10,14].map(function(w){return {wch:w}});
  var wb=X.utils.book_new();X.utils.book_append_sheet(wb,ws1,'일정 목록');X.utils.book_append_sheet(wb,ws2,'일정 원본');X.utils.book_append_sheet(wb,ws3,'월별 통계');
  return X.write(wb,{bookType:'xlsx',type:'array'})}

/* ================= login (server mode) ================= */
var loginOpen=false;
function showLogin(){if(loginOpen)return;loginOpen=true;setStatus('err','로그인이 필요해요');
  var pw=h('input',{type:'password','class':'in','data-autofocus':true,autocomplete:'current-password','aria-label':'비밀번호'}),err=h('p',{'class':'errmsg',role:'alert'});
  var go=function(){api('POST','api/login',{password:pw.value}).then(function(){loginOpen=false;m.close();loadApi()},function(){err.textContent='비밀번호가 맞지 않아요.';pw.select()})};
  pw.addEventListener('keydown',function(e){if(e.key==='Enter')go()});
  var m=modal({title:'로그인',small:true,body:h('div',{style:'display:flex;flex-direction:column;gap:10px'},h('p',{'class':'note',text:'서버에 설정한 비밀번호(APP_PASSWORD)를 입력하세요.'}),pw,err),
    foot:[h('span',{'class':'sp'}),h('button',{type:'button','class':'btn primary',text:'로그인',onclick:go})],onClose:function(){loginOpen=false}})}

/* ================= wiring ================= */
$('menuBtn').innerHTML=svgIco(ICON.menu);$('sBtn').innerHTML=svgIco(ICON.search);$('sIco').innerHTML=svgIco(ICON.search);
$('prev').innerHTML=svgIco(ICON.left);$('next').innerHTML=svgIco(ICON.right);
function move(dir){var c=S.cursor;S.cursor=S.view==='month'?new Date(c.getFullYear(),c.getMonth()+dir,1):addDays(c,7*dir);viewWeek.scrolled=false;render()}
$('prev').addEventListener('click',function(){move(-1)});$('next').addEventListener('click',function(){move(1)});
$('todayBtn').addEventListener('click',function(){S.cursor=dayOnly(new Date());viewWeek.scrolled=false;render()});
$('addBtn').addEventListener('click',function(){$('side').classList.remove('open');openEditor(null,S.view==='dash'||S.view==='stats'||S.view==='list'?todayKey():keyOf(S.cursor))});
$('fab').addEventListener('click',function(){openEditor(null,S.view==='month'||S.view==='week'?keyOf(S.cursor):todayKey())});
$('menuBtn').addEventListener('click',function(){$('side').classList.toggle('open')});
document.addEventListener('click',function(e){var sd=$('side');if(sd.classList.contains('open')&&!sd.contains(e.target)&&e.target!==$('menuBtn')&&!$('menuBtn').contains(e.target))sd.classList.remove('open')});
$('sBtn').addEventListener('click',function(){$('searchBox').classList.toggle('show');if($('searchBox').classList.contains('show'))$('q').focus()});
var qT;$('q').addEventListener('input',function(){clearTimeout(qT);var v=this.value.trim();qT=setTimeout(function(){S.q=v;if(v&&S.view!=='list'){S.view='list'}render()},200)});
$('bell').addEventListener('click',openBell);$('subjMng').addEventListener('click',function(){$('side').classList.remove('open');openSubjManager()});$('exportBtn').addEventListener('click',openExport);
$('notifBtn').addEventListener('click',openBell);
document.addEventListener('keydown',function(e){if($('modalRoot').childNodes.length)return;var tag=(e.target.tagName||'').toLowerCase();if(tag==='input'||tag==='textarea'||tag==='select')return;
  if(e.key==='n'){e.preventDefault();$('addBtn').click()}else if(e.key==='/'){e.preventDefault();$('q').focus()}
  else if(e.key==='t'){$('todayBtn').click()}else if(e.key==='ArrowLeft'&&(S.view==='month'||S.view==='week'))move(-1);else if(e.key==='ArrowRight'&&(S.view==='month'||S.view==='week'))move(1)});
document.addEventListener('visibilitychange',function(){if(!document.hidden){if(Store.mode==='api')loadApi();if(Store.mode==='github')ghPull();checkReminders();refresh()}
  else if(Store.mode==='github'&&ghHasPending()){clearTimeout(GH.timer);ghSync()}});
setInterval(function(){checkReminders();if(document.hidden||$('modalRoot').childNodes.length)return;if(Store.mode==='api')loadApi();if(Store.mode==='github')ghPull()},30000);
setInterval(function(){if(S.view==='week'||S.view==='dash')refresh()},60000);
if('serviceWorker' in navigator&&location.protocol!=='file:'&&!window.claude){navigator.serviceWorker.register('sw.js').catch(function(){})}
renderFoot();boot();setTimeout(checkReminders,1500);
})();
</script>
